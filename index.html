
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora Científica</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculadora">

        <h1>Calculadora Científica</h1>

        <input
            type="text"
            id="display"
            class="display"
            value="0"
            disabled
        >

        <div class="botoes">

            <!-- Funções científicas -->
            <button onclick="funcao('sin')">sin</button>
            <button onclick="funcao('cos')">cos</button>
            <button onclick="funcao('tan')">tan</button>
            <button onclick="funcao('sqrt')">√</button>

            <button onclick="funcao('log')">log</button>
            <button onclick="funcao('ln')">ln</button>
            <button onclick="funcao('square')">x²</button>
            <button onclick="funcao('cube')">x³</button>

            <button onclick="adicionar('(')">(</button>
            <button onclick="adicionar(')')">)</button>
            <button onclick="adicionar('^')">xʸ</button>
            <button onclick="adicionar('π')">π</button>

            <!-- Controles -->
            <button class="limpar" onclick="limpar()">C</button>
            <button onclick="apagar()">⌫</button>
            <button onclick="adicionar('%')">%</button>
            <button class="operador" onclick="adicionar('/')">÷</button>

            <!-- Números -->
            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button class="operador" onclick="adicionar('*')">×</button>

            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button class="operador" onclick="adicionar('-')">−</button>

            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            <button class="operador" onclick="adicionar('+')">+</button>

            <button class="zero" onclick="adicionar('0')">0</button>
            <button onclick="adicionar('.')">.</button>
            <button class="igual" onclick="calcular()">=</button>

        </div>

        <p class="info">
            Trigonometria em graus
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
